server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:h2:mem:commandesdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

management.endpoints.web.exposure.include=health,info

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql

#Config RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123


#Config Resilience4j
# OpenFeign ? délais par appel, en millisecondes
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Ordre des aspects
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3

# Retry ? trois tentatives au total sur les erreurs transitoires
resilience4j.retry.instances.clients-service.max-attempts=3
resilience4j.retry.instances.clients-service.wait-duration=500ms
resilience4j.retry.instances.clients-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.retry.instances.catalogue-service.max-attempts=3
resilience4j.retry.instances.catalogue-service.wait-duration=500ms
resilience4j.retry.instances.catalogue-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Circuit breaker ? les exceptions Feign 4xx sont ignorées dans le calcul
resilience4j.circuitbreaker.instances.clients-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.clients-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.clients-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.clients-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.clients-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clients-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clients-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.clients-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.catalogue-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.catalogue-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogue-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.catalogue-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.catalogue-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogue-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.catalogue-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogue-service.automatic-transition-from-open-to-half-open-enabled=true

# Bulkhead ? dix appels simultanés par service, sans attente
resilience4j.bulkhead.instances.clients-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.clients-service.max-wait-duration=0ms
resilience4j.bulkhead.instances.catalogue-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.catalogue-service.max-wait-duration=0ms

# Rate limiter ? cinq consultations enrichies par période d'une seconde
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms