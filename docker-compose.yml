# ============================================================================
# Environnement d'infrastructure global — Projet JEE 5e année
#   Mailpit , Kafka  et  Kafka UI
# ============================================================================

networks:
  tp-net:
    driver: bridge

services:

  # Mailpit : SMTP de test sur localhost:1025 + interface web  http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpitx
    networks:
      - tp-net
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # interface web

  # Kafka : broker unique en mode KRaft Accesssible pour les services via : localhost:9092
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    networks:
      - tp-net
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners : INTERNAL pour les conteneurs, EXTERNAL pour Windows,
      # CONTROLLER pour le consensus KRaft.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # Le listener CONTROLLER doit aussi être annoncé : sinon Kafka 3.9
      # reprend 0.0.0.0 depuis KAFKA_LISTENERS et refuse de démarrer.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,CONTROLLER://kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Topics internes : une seule copie (un seul broker).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Le topic du TP est créé explicitement (Partie 2 du V7).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Identifiant KRaft : ne pas changer tant que le volume existe.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Kafka UI : Interface administration du broker sur http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    networks:
      - tp-net
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data: